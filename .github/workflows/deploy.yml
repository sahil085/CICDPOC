name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches: [ "master" ] # Jab bhi aap main branch par push karenge, yeh chalega

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR file to EC2 via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/"

      - name: Deploy and Run Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # 1. Service restart karo
            sudo systemctl restart springboot-app
            
            echo "Waiting for application to boot up using health check polling..."
            
            # 2. Polling Loop Configuration
            TIMEOUT=60            # Maximum 60 seconds wait karenge
            ELAPSED=0
            INTERVAL=5            # हर 5 seconds mein check karenge
            SUCCESS=false
            
            while [ $ELAPSED -lt $TIMEOUT ]; do
            # Localhost par actuator health endpoint hit karte hain
            if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
            echo "Application is up and healthy!"
            SUCCESS=true
            break
            fi
            
            echo "App is still initializing... waiting ${INTERVAL}s (${ELAPSED}/${TIMEOUT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            done
            
            # 3. Final Verification
            if [ "$SUCCESS" = false ]; then
            echo "Deployment FAILED! Application did not start within $TIMEOUT seconds. Here are the logs:"
            sudo journalctl -u springboot-app -n 50 --no-pager
            exit 1
            fi
